name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  repository_dispatch:
    types: [stable-release-recovery]

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      state: ${{ steps.state.outputs.state }}
      next_action: ${{ steps.state.outputs.next_action }}
      digest: ${{ steps.state.outputs.digest }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REVISION: ${{ github.sha }}
          INPUT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_REVISION: ${{ github.event.client_payload.revision }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          git fetch --force --tags origin
          if [ "$EVENT_NAME" = push ]; then
            revision=$EVENT_REVISION
            version=$(git show "$revision:VERSION")
          else
            if [ "$EVENT_NAME" != repository_dispatch ] || \
              [ "$GITHUB_REF" != refs/heads/main ]; then
              printf 'release recovery must run from main repository_dispatch, got %s/%s\n' \
                "$EVENT_NAME" "$GITHUB_REF" >&2
              exit 1
            fi
            revision=$INPUT_REVISION
            version=$INPUT_VERSION
          fi
          python3 - "$version" "$revision" <<'PY'
          import re
          import sys

          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1]) is None:
              raise SystemExit("release version must be stable SemVer")
          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[2]) is None:
              raise SystemExit("release revision must be a full lowercase SHA")
          PY
          {
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$revision"
          } >>"$GITHUB_OUTPUT"
      - name: Require the owner-reviewed develop promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          # jq programs are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          prs=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$REVISION/pulls")
          matches=$(printf '%s' "$prs" | jq -c \
            --arg revision "$REVISION" '[
              .[] | select(
                .state == "closed" and
                .base.ref == "main" and
                .head.ref == "develop" and
                .user.login == "github-actions[bot]" and
                .merge_commit_sha == $revision
              )
            ]')
          [ "$(printf '%s' "$matches" | jq 'length')" -eq 1 ] || {
            echo 'release revision is not one owner-merged develop promotion' >&2
            exit 1
          }
          number=$(printf '%s' "$matches" | jq -r '.[0].number')
          promotion=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          printf '%s' "$promotion" | jq -e \
            --arg revision "$REVISION" '
              .state == "closed" and
              .merged == true and
              .base.ref == "main" and
              .head.ref == "develop" and
              .user.login == "github-actions[bot]" and
              .merge_commit_sha == $revision and
              .merged_by.login == "jskorlol"
            ' >/dev/null || {
            echo 'promotion details do not match the release boundary' >&2
            exit 1
          }
          head=$(printf '%s' "$promotion" | jq -r '.head.sha')
          reviews=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$number/reviews?per_page=100")
          printf '%s' "$reviews" | jq -e --arg head "$head" '
            any(.[][];
              .user.login == "jskorlol" and
              .state == "APPROVED" and
              .commit_id == $head)
          ' >/dev/null || {
            echo 'develop promotion lacks an owner approval for its exact head' >&2
            exit 1
          }
      - name: Reconcile current release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format json | jq -r .state)
          if [ "$state" = absent ]; then
            mode=--require-absent
          else
            mode=--allow-same-identity
          fi
          python3 scripts/runtime_versions.py release-preflight \
            --version "$VERSION" --revision "$REVISION" --live "$mode"
          printf "Release identity: \`%s\` at \`%s\`; initial state: \`%s\`.\n" \
            "$VERSION" "$REVISION" "$state" >>"$GITHUB_STEP_SUMMARY"

  candidate-platform:
    name: candidate-${{ matrix.architecture }}
    if: needs.plan.outputs.next_action == 'build_candidate'
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public repository and immutable Git tag gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.visibility == "public") | .id' >/dev/null
          rulesets=$(gh api "repos/$GITHUB_REPOSITORY/rulesets")
          tag_id=$(printf '%s' "$rulesets" | jq -er \
            '[.[] | select(.target == "tag" and .enforcement == "active")][0].id')
          tag_ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$tag_id")
          printf '%s' "$tag_ruleset" | jq -e '
            .conditions.ref_name.include == ["refs/tags/v*"] and
            ([.rules[].type] | index("deletion") != null) and
            ([.rules[].type] | index("update") != null)' >/dev/null
      - name: Require an absent version tag immediately before native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          printf '%s' "$state" | jq -e \
            '.state == "absent" and .next_action == "build_candidate"' >/dev/null
      - name: Reclaim runner disk for the cold native build
        run: |
          set -euo pipefail
          before_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          after_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Reclaimed %s KiB; %s KiB available on /.\n' \
            "$((after_kb - before_kb))" "$after_kb"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve non-secret build arguments
        id: build-args
        run: |
          set -eu
          python3 scripts/runtime_versions.py build-args \
            --format json --revision "$REVISION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build and push the native version candidate by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          BUILDKIT_MULTI_PLATFORM: 1
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},oci-artifact=true,push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=runtime-release-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=runtime-release-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true
      - name: Export the native digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo 'native build did not return a sha256 digest' >&2; exit 1 ;;
          esac
          [ "${#DIGEST}" -eq 71 ]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" >"$RUNNER_TEMP/digests/${{ matrix.architecture }}"
      - name: Upload the native digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: candidate
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.next_action != 'build_candidate' ||
       needs.candidate-platform.result == 'success')
    needs: [plan, candidate-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.state.outputs.digest }}
    env:
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public repository and immutable Git tag gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.visibility == "public") | .id' >/dev/null
          rulesets=$(gh api "repos/$GITHUB_REPOSITORY/rulesets")
          tag_id=$(printf '%s' "$rulesets" | jq -er \
            '[.[] | select(.target == "tag" and .enforcement == "active")][0].id')
          tag_ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$tag_id")
          printf '%s' "$tag_ruleset" | jq -e '
            .conditions.ref_name.include == ["refs/tags/v*"] and
            ([.rules[].type] | index("deletion") != null) and
            ([.rules[].type] | index("update") != null)' >/dev/null
      - name: Reconcile candidate state immediately before manifest assembly
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download both native digests
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create and verify the version candidate manifest
        if: steps.before.outputs.next_action == 'build_candidate'
        run: |
          set -euo pipefail
          refs=()
          for architecture in amd64 arm64; do
            file="$RUNNER_TEMP/digests/$architecture"
            [ -f "$file" ]
            digest=$(cat "$file")
            case "$digest" in
              sha256:[0-9a-f][0-9a-f]*) ;;
              *) echo "invalid $architecture digest" >&2; exit 1 ;;
            esac
            [ "${#digest}" -eq 71 ]
            refs+=("$IMAGE@$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "${refs[@]}"
          digest=
          platforms=
          verified=false
          attempt=1
          while [ "$attempt" -le 18 ]; do
            digest=$(docker buildx imagetools inspect \
              "$IMAGE:$VERSION" 2>/dev/null \
              | awk '$1 == "Digest:" {print $2; exit}') || digest=
            platforms=$(docker buildx imagetools inspect --raw \
              "$IMAGE:$VERSION" 2>/dev/null | jq -c '
                [.manifests[] |
                 select(.platform.os == "linux" and
                        (.platform.architecture == "amd64" or
                         .platform.architecture == "arm64")) |
                 (.platform.os + "/" + .platform.architecture)] |
                unique | sort') || platforms=
            if [ -n "$digest" ] && \
               [ "$platforms" = '["linux/amd64","linux/arm64"]' ]; then
              verified=true
              break
            fi
            [ "$attempt" -lt 18 ] || break
            sleep 5
            attempt=$((attempt + 1))
          done
          [ "$verified" = true ] || {
            echo 'release manifest did not converge' >&2
            exit 1
          }
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo 'manifest creation did not return a sha256 digest' >&2; exit 1 ;;
          esac
          [ "${#digest}" -eq 71 ]
      - name: Verify candidate identity
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          attempt=1
          while :; do
            if output=$(python3 scripts/runtime_versions.py release-state \
              --version "$VERSION" --revision "$REVISION" --live \
              --format github-output); then
              state=$(printf '%s\n' "$output" | sed -n 's/^state=//p')
              if [ "$state" != absent ]; then
                printf '%s\n' "$output" >>"$GITHUB_OUTPUT"
                break
              fi
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
      - name: Verify public GHCR package before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          package=$(gh api \
            "orgs/korioinc/packages/container/multica-runtime-controller")
          printf '%s' "$package" | jq -e '
            .name == "multica-runtime-controller" and
            .package_type == "container" and
            .visibility == "public"' >/dev/null
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          printf '%s' "$state" | jq -e '
            .state == "candidate_verified" or
            .state == "release_verified" or
            .state == "latest_digest_matched"' >/dev/null

  finalize:
    name: finalize
    needs: [plan, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    outputs:
      digest: ${{ steps.state.outputs.digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release after image verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          state_json=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          state=$(printf '%s' "$state_json" | jq -r .state)
          digest=$(printf '%s' "$state_json" | jq -r .digest)
          if [ "$state" = candidate_verified ]; then
            . build/runtime-versions.env
            cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          Revision: \`$REVISION\`

          Versioned image: \`ghcr.io/korioinc/multica-runtime-controller:$VERSION\`

          Manifest digest: \`$digest\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          Runtime CLIs: Multica \`$MULTICA_CLI_VERSION\`, Codex \`$CODEX_VERSION\`, Pi \`$PI_VERSION\`

          The image was published with max-mode provenance and an SBOM. The manifest digest is authoritative; the version tag is never overwritten by automation, and \`latest\` is promoted only after this release exists.
          EOF
            gh release create "v$VERSION" --target "$REVISION" \
              --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$state" != release_verified ] && [ "$state" != latest_digest_matched ]; then
            printf 'unexpected state before finalize: %s\n' "$state" >&2
            exit 1
          fi
      - name: Verify finalized release identity
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch --force --tags origin
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"

  promote:
    name: promote
    needs: [plan, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile promotion state
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.before.outputs.next_action == 'promote_latest'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: steps.before.outputs.next_action == 'promote_latest'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the verified digest to latest
        if: steps.before.outputs.next_action == 'promote_latest'
        env:
          DIGEST: ${{ steps.before.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/korioinc/multica-runtime-controller:latest \
            "ghcr.io/korioinc/multica-runtime-controller@$DIGEST"
      - name: Verify terminal release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          result=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          printf '%s' "$result" | jq -e \
            '.state == "latest_digest_matched" and .next_action == "already_published"' >/dev/null
          digest=$(printf '%s' "$result" | jq -r .digest)
          printf "Release \`%s\` at \`%s\` completed as \`%s\`.\n" \
            "$VERSION" "$REVISION" "$digest" >>"$GITHUB_STEP_SUMMARY"
