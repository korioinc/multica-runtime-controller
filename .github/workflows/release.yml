name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_exists: ${{ steps.version.outputs.release_exists }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the merged main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          python3 scripts/runtime_versions.py --root "$GITHUB_WORKSPACE" validate
          live_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          [ "$live_main" = "$GITHUB_SHA" ] || {
            echo 'A newer main revision exists.' >&2
            exit 1
          }
          release_exists=false
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            release_target=$(gh release view "v$VERSION" --json targetCommitish \
              --jq .targetCommitish)
            [ "$release_target" = "$GITHUB_SHA" ] || {
              echo "Release v$VERSION belongs to another revision." >&2
              exit 1
            }
            release_exists=true
          fi
          tag_target=$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')
          if [ -n "$tag_target" ] && [ "$tag_target" != "$GITHUB_SHA" ]; then
            echo "Tag v$VERSION belongs to another revision." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "release_exists=$release_exists"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.architecture }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      REVISION: ${{ github.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve build arguments
        id: args
        run: |
          set -euo pipefail
          python3 scripts/runtime_versions.py --root "$GITHUB_WORKSPACE" build-args \
            --revision "$REVISION" --version "$VERSION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the native image by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ steps.args.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Record the native digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo 'The native build returned an invalid digest.' >&2; exit 1 ;;
          esac
          [ "${#DIGEST}" -eq 71 ]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the native digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      RELEASE_EXISTS: ${{ needs.plan.outputs.release_exists }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Download native digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify the multi-platform image
        id: manifest
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/digests" -type f | sort)
          [ "${#files[@]}" -eq 2 ]
          refs=()
          for file in "${files[@]}"; do
            digest=$(basename "$file")
            case "$digest" in
              [0-9a-f][0-9a-f]*) ;;
              *) echo 'Invalid digest artifact.' >&2; exit 1 ;;
            esac
            [ "${#digest}" -eq 64 ]
            refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${refs[@]}"
          verified=false
          for _ in $(seq 1 60); do
            platforms=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION" \
              2>/dev/null | jq -c '[.manifests[] | select(
                .platform.os == "linux" and
                (.platform.architecture == "amd64" or
                 .platform.architecture == "arm64")
              ) | (.platform.os + "/" + .platform.architecture)] | unique | sort') || true
            if [ "$platforms" = '["linux/amd64","linux/arm64"]' ]; then
              verified=true
              break
            fi
            sleep 5
          done
          [ "$verified" = true ]
          manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest}}')
          digest=$(jq -er .digest <<<"$manifest")
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          Image: \`$IMAGE@$DIGEST\`

          Tags: \`$VERSION\`, \`latest\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`
          EOF
          if [ "$RELEASE_EXISTS" = false ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release view "$TAG" --json targetCommitish \
              --jq .targetCommitish | grep -Fx "$GITHUB_SHA"
          fi
          printf "Released '%s' as '%s@%s'.\n" \
            "$TAG" "$IMAGE" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"
      - name: Dispatch the Helm chart update
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ secrets.HELM_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg manifest_digest "$DIGEST" \
            --arg source_revision "$GITHUB_SHA" \
            '{
              event_type: "runtime-released",
              client_payload: {
                version: $version,
                manifest_digest: $manifest_digest,
                source_revision: $source_revision
              }
            }' \
            | gh api --method POST repos/korioinc/helm/dispatches --input -
