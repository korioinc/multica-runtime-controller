name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: version-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
    steps:
      - name: Check out the merged main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          python3 scripts/runtime_versions.py --root "$GITHUB_WORKSPACE" validate
          live_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          [ "$live_main" = "$GITHUB_SHA" ] || {
            echo 'A newer main revision exists.' >&2
            exit 1
          }
          release_exists=false
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            release_target=$(gh release view "v$VERSION" --json targetCommitish \
              --jq .targetCommitish)
            [ "$release_target" = "$GITHUB_SHA" ] || {
              echo "Release v$VERSION belongs to another revision." >&2
              exit 1
            }
            release_exists=true
          fi
          tag_target=$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')
          if [ -n "$tag_target" ] && [ "$tag_target" != "$GITHUB_SHA" ]; then
            echo "Tag v$VERSION belongs to another revision." >&2
            exit 1
          fi
          {
            echo "value=$VERSION"
            echo "tag=v$VERSION"
            echo "release_exists=$release_exists"
          } >>"$GITHUB_OUTPUT"
      - name: Resolve build arguments
        id: args
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 scripts/runtime_versions.py --root "$GITHUB_WORKSPACE" build-args \
            --revision "$GITHUB_SHA" --version "$VERSION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          build-args: ${{ steps.args.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Create the GitHub Release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_EXISTS: ${{ steps.version.outputs.release_exists }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          Image: \`$IMAGE@$DIGEST\`

          Tags: \`$VERSION\`, \`latest\`
          EOF
          if [ "$RELEASE_EXISTS" = false ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release view "$TAG" --json targetCommitish \
              --jq .targetCommitish | grep -Fx "$GITHUB_SHA"
          fi
          printf "Released '%s' as '%s@%s'.\n" \
            "$TAG" "$IMAGE" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"
