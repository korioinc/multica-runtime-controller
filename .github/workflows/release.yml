name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (X.Y.Z)
        required: true
        type: string
      revision:
        description: Exact 40-character main revision
        required: true
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      state: ${{ steps.state.outputs.state }}
      next_action: ${{ steps.state.outputs.next_action }}
      digest: ${{ steps.state.outputs.digest }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REVISION: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          git fetch --force --tags origin
          if [ "$EVENT_NAME" = push ]; then
            revision=$EVENT_REVISION
            version=$(git show "$revision:VERSION")
          else
            [ "$GITHUB_REF" = refs/heads/main ] || {
              printf 'manual release workflow ref must be main, got %s\n' "$GITHUB_REF" >&2
              exit 1
            }
            revision=$INPUT_REVISION
            version=$INPUT_VERSION
          fi
          python3 - "$version" "$revision" <<'PY'
          import re
          import sys

          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1]) is None:
              raise SystemExit("release version must be stable SemVer")
          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[2]) is None:
              raise SystemExit("release revision must be a full lowercase SHA")
          PY
          {
            printf 'version=%s\n' "$version"
            printf 'revision=%s\n' "$revision"
          } >>"$GITHUB_OUTPUT"
      - name: Reconcile current release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format json | jq -r .state)
          if [ "$state" = absent ]; then
            mode=--require-absent
          else
            mode=--allow-same-identity
          fi
          python3 scripts/runtime_versions.py release-preflight \
            --version "$VERSION" --revision "$REVISION" --live "$mode"
          printf "Release identity: \`%s\` at \`%s\`; initial state: \`%s\`.\n" \
            "$VERSION" "$REVISION" "$state" >>"$GITHUB_STEP_SUMMARY"

  candidate:
    name: candidate
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.state.outputs.digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public repository and immutable Git tag gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.visibility == "public") | .id' >/dev/null
          rulesets=$(gh api "repos/$GITHUB_REPOSITORY/rulesets")
          tag_id=$(printf '%s' "$rulesets" | jq -er \
            '[.[] | select(.target == "tag" and .enforcement == "active")][0].id')
          tag_ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$tag_id")
          printf '%s' "$tag_ruleset" | jq -e '
            .bypass_actors == [] and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            ([.rules[].type] | index("deletion") != null) and
            ([.rules[].type] | index("update") != null)' >/dev/null
      - name: Reconcile candidate state immediately before build
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
      - name: Reclaim runner disk for the cold multi-platform build
        if: steps.before.outputs.next_action == 'build_candidate'
        run: |
          set -euo pipefail
          before_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          after_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Reclaimed %s KiB; %s KiB available on /.\n' \
            "$((after_kb - before_kb))" "$after_kb"
      - name: Set up QEMU
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve non-secret build arguments
        if: steps.before.outputs.next_action == 'build_candidate'
        id: build-args
        run: |
          set -eu
          python3 scripts/runtime_versions.py build-args \
            --format json --revision "$REVISION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build and push version candidate
        if: steps.before.outputs.next_action == 'build_candidate'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/korioinc/multica-runtime-controller:${{ needs.plan.outputs.version }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=runtime-release
          cache-to: type=gha,mode=max,scope=runtime-release
          provenance: mode=max
          sbom: true
      - name: Verify candidate identity
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          attempt=1
          while :; do
            if output=$(python3 scripts/runtime_versions.py release-state \
              --version "$VERSION" --revision "$REVISION" --live \
              --format github-output); then
              state=$(printf '%s\n' "$output" | sed -n 's/^state=//p')
              if [ "$state" != absent ]; then
                printf '%s\n' "$output" >>"$GITHUB_OUTPUT"
                break
              fi
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
      - name: Verify public GHCR package before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          package=$(gh api \
            "orgs/korioinc/packages/container/multica-runtime-controller")
          printf '%s' "$package" | jq -e '
            .name == "multica-runtime-controller" and
            .package_type == "container" and
            .visibility == "public"' >/dev/null
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          printf '%s' "$state" | jq -e '
            .state == "candidate_verified" or
            .state == "release_verified" or
            .state == "latest_digest_matched"' >/dev/null

  finalize:
    name: finalize
    needs: [plan, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    outputs:
      digest: ${{ steps.state.outputs.digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release after image verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          state_json=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          state=$(printf '%s' "$state_json" | jq -r .state)
          digest=$(printf '%s' "$state_json" | jq -r .digest)
          if [ "$state" = candidate_verified ]; then
            . build/runtime-versions.env
            cat >"$RUNNER_TEMP/release-notes.md" <<EOF
          Revision: \`$REVISION\`

          Versioned image: \`ghcr.io/korioinc/multica-runtime-controller:$VERSION\`

          Manifest digest: \`$digest\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          Runtime CLIs: Multica \`$MULTICA_CLI_VERSION\`, Codex \`$CODEX_VERSION\`, Pi \`$PI_VERSION\`

          The image was published with max-mode provenance and an SBOM. The manifest digest is authoritative; the version tag is never overwritten by automation, and \`latest\` is promoted only after this release exists.
          EOF
            gh release create "v$VERSION" --target "$REVISION" \
              --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$state" != release_verified ] && [ "$state" != latest_digest_matched ]; then
            printf 'unexpected state before finalize: %s\n' "$state" >&2
            exit 1
          fi
      - name: Verify finalized release identity
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git fetch --force --tags origin
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"

  promote:
    name: promote
    needs: [plan, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile promotion state
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live \
            --format github-output >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.before.outputs.next_action == 'promote_latest'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: steps.before.outputs.next_action == 'promote_latest'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the verified digest to latest
        if: steps.before.outputs.next_action == 'promote_latest'
        env:
          DIGEST: ${{ steps.before.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/korioinc/multica-runtime-controller:latest \
            "ghcr.io/korioinc/multica-runtime-controller@$DIGEST"
      - name: Verify terminal release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          result=$(python3 scripts/runtime_versions.py release-state \
            --version "$VERSION" --revision "$REVISION" --live --format json)
          printf '%s' "$result" | jq -e \
            '.state == "latest_digest_matched" and .next_action == "already_published"' >/dev/null
          digest=$(printf '%s' "$result" | jq -r .digest)
          printf "Release \`%s\` at \`%s\` completed as \`%s\`.\n" \
            "$VERSION" "$REVISION" "$digest" >>"$GITHUB_STEP_SUMMARY"
