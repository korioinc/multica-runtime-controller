name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/korioinc/multica-runtime-controller

jobs:
  plan:
    name: plan-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      published: ${{ steps.plan.outputs.published }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR for immutable release lookup
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate VERSION, source revision and existing release bytes
        id: plan
        run: >-
          .github/scripts/release.sh --root "$GITHUB_WORKSPACE"
          --image "$IMAGE" --revision "$GITHUB_SHA" plan

  verify:
    name: verify-release-source
    needs: plan
    if: needs.plan.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Verify controller source and workflows
        run: |
          make runtime-version-test repository-validate workflow-validate test test-race vet

  build:
    name: build-${{ matrix.architecture }}
    needs: [plan, verify]
    if: needs.plan.outputs.published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse the matching native candidate when retrying
        id: candidate
        run: >-
          .github/scripts/release.sh --root "$GITHUB_WORKSPACE"
          --image "$IMAGE" --revision "$GITHUB_SHA"
          prepare-native --platform '${{ matrix.platform }}'
      - name: Resolve controller-only build arguments
        if: steps.candidate.outputs.reuse != 'true'
        id: args
        run: |
          set -euo pipefail
          scripts/runtime-versions.sh --root "$GITHUB_WORKSPACE" build-args \
            --revision "$GITHUB_SHA" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build the native candidate locally
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.candidate.outputs.image }}
          build-args: ${{ steps.args.outputs.value }}
          provenance: false
          sbom: false
      - name: Execute the native base check and push only verified candidate bytes
        run: >-
          .github/scripts/release.sh --root "$GITHUB_WORKSPACE"
          --image "$IMAGE" --revision "$GITHUB_SHA"
          record-native --platform '${{ matrix.platform }}'
          --records "$RUNNER_TEMP/native-results"
      - name: Upload the verified native result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-results/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-release
    needs: [plan, verify, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.published == 'true' && needs.build.result == 'skipped') ||
       (needs.verify.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download native results
        if: needs.plan.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-native-*
          path: ${{ runner.temp }}/native-results
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the immutable version, GitHub Release and current latest
        run: >-
          .github/scripts/release.sh --root "$GITHUB_WORKSPACE"
          --image "$IMAGE" --revision "$GITHUB_SHA"
          publish --records "$RUNNER_TEMP/native-results"
