name: Create develop into main PR

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: Exact develop merge SHA to reconcile
        required: true
        type: string

permissions: {}

concurrency:
  group: create-develop-to-main-pr
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      develop_sha: ${{ steps.resolve.outputs.develop_sha }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      release_state: ${{ steps.resolve.outputs.release_state }}
    steps:
      - name: Check out the live develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve one dependency-ordered reconciliation action
        id: resolve
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
          TARGET_ROOT: ${{ github.workspace }}
          TRUSTED_RESOLVER: ${{ runner.temp }}/trusted-runtime-versions.py
        run: |
          set -euo pipefail
          [ "$EVENT_REF" = refs/heads/main ]
          live_workflow_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$EVENT_SHA" = "$live_workflow_sha" ]
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/develop:refs/remotes/origin/develop
          main_sha=$(git rev-parse origin/main)
          develop_sha=$(git rev-parse origin/develop)
          if [ -n "$INPUT_REVISION" ]; then
            case "$INPUT_REVISION" in
              *[!0-9a-f]*|'') echo 'revision must be lowercase hexadecimal' >&2; exit 1 ;;
            esac
            [ "${#INPUT_REVISION}" -eq 40 ]
            git merge-base --is-ancestor "$INPUT_REVISION" "$develop_sha" || {
              printf 'requested revision %s is not an ancestor of live develop %s\n' \
                "$INPUT_REVISION" "$develop_sha" >&2
              exit 1
            }
          fi

          expected_blob=$(git rev-parse "$main_sha:scripts/runtime_versions.py")
          git show "$main_sha:scripts/runtime_versions.py" >"$TRUSTED_RESOLVER"
          [ "$(git hash-object "$TRUSTED_RESOLVER")" = "$expected_blob" ]
          chmod 0555 "$TRUSTED_RESOLVER"

          release_state=not_checked
          if ! git merge-base --is-ancestor "$main_sha" "$develop_sha"; then
            mode=sync
          elif git diff --quiet "$main_sha" "$develop_sha" --; then
            mode=none
          else
            inventory=$(python3 -I "$TRUSTED_RESOLVER" --root "$TARGET_ROOT" \
              release-inventory --live --format json)
            if [ "$(printf '%s' "$inventory" | jq -r .active)" = true ]; then
              mode=wait-release
              release_state=$(printf '%s' "$inventory" | jq -r .state)
            else
              mode=promotion
              release_state=terminal
            fi
          fi
          {
            printf 'main_sha=%s\n' "$main_sha"
            printf 'develop_sha=%s\n' "$develop_sha"
            printf 'mode=%s\n' "$mode"
            printf 'release_state=%s\n' "$release_state"
          } >>"$GITHUB_OUTPUT"
          printf "Reconcile mode: \`%s\`; main: \`%s\`; develop: \`%s\`; release: \`%s\`.\n" \
            "$mode" "$main_sha" "$develop_sha" "$release_state" \
            >>"$GITHUB_STEP_SUMMARY"

  write-sync:
    name: write-sync
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      needs.resolve.outputs.mode == 'sync'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.write.outputs.head_sha }}
    steps:
      - name: Check out live develop without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Create the exact two-parent sync commit
        id: write
        env:
          AUTOMATION_TOKEN: ${{ github.token }}
          DEVELOP_SHA: ${{ needs.resolve.outputs.develop_sha }}
          MAIN_SHA: ${{ needs.resolve.outputs.main_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/develop:refs/remotes/origin/develop
          [ "$(git rev-parse origin/main)" = "$MAIN_SHA" ]
          [ "$(git rev-parse origin/develop)" = "$DEVELOP_SHA" ]
          branch=automation/sync-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch" "$DEVELOP_SHA"
          git merge --no-ff --no-edit "$MAIN_SHA"
          head_sha=$(git rev-parse HEAD)
          [ "$(git rev-parse HEAD^1)" = "$DEVELOP_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$MAIN_SHA" ]
          git diff --quiet "$DEVELOP_SHA" "$head_sha" --

          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          askpass=$RUNNER_TEMP/git-askpass
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AUTOMATION_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0700 "$askpass"
          if [ -n "$remote_sha" ]; then
            lease="--force-with-lease=refs/heads/$branch:$remote_sha"
          else
            lease="--force-with-lease=refs/heads/$branch:"
          fi
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "$lease" "https://github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"
          printf 'head_sha=%s\n' "$head_sha" >>"$GITHUB_OUTPUT"

  propose-sync:
    name: propose-sync
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      needs.resolve.outputs.mode == 'sync'
    needs: [resolve, write-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pull_request_number: ${{ steps.pr.outputs.pull_request_number }}
    steps:
      - name: Create or update the bot-authored sync PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.write-sync.outputs.head_sha }}
        run: |
          set -euo pipefail
          branch=automation/sync-main
          prs=$(gh pr list --state open --base develop --head "$branch" \
            --json number --limit 10)
          count=$(printf '%s' "$prs" | jq 'length')
          [ "$count" -le 1 ] || { echo 'duplicate sync PRs detected' >&2; exit 1; }
          if [ "$count" -eq 0 ]; then
            url=$(gh pr create --base develop --head "$branch" \
              --title 'chore: sync main ancestry into develop' \
              --body 'Exact two-parent ancestry restoration; the merge workflow must preserve this merge commit.')
            number=${url##*/}
          else
            number=$(printf '%s' "$prs" | jq -r '.[0].number')
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          printf '%s' "$pr" | jq -e \
            --arg head "$HEAD_SHA" --arg repository "$GITHUB_REPOSITORY" '
              .state == "open" and
              .base.ref == "develop" and
              .head.ref == "automation/sync-main" and
              .head.repo.full_name == $repository and
              .head.sha == $head and
              .user.login == "github-actions[bot]"
            ' >/dev/null
          {
            printf 'head_sha=%s\n' "$HEAD_SHA"
            printf 'pull_request_number=%s\n' "$number"
          } >>"$GITHUB_OUTPUT"

  promote:
    name: promote
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      needs.resolve.outputs.mode == 'promotion'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pull_request_number: ${{ steps.pr.outputs.pull_request_number }}
    steps:
      - name: Maintain exactly one direct develop to main PR
        id: pr
        env:
          DEVELOP_SHA: ${{ needs.resolve.outputs.develop_sha }}
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.resolve.outputs.main_sha }}
        run: |
          set -euo pipefail
          live_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          live_develop=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          [ "$live_main" = "$MAIN_SHA" ]
          [ "$live_develop" = "$DEVELOP_SHA" ]
          prs=$(gh pr list --state open --base main --head develop \
            --json number --limit 10)
          count=$(printf '%s' "$prs" | jq 'length')
          [ "$count" -le 1 ] || { echo 'duplicate promotion PRs detected' >&2; exit 1; }
          if [ "$count" -eq 0 ]; then
            url=$(gh pr create --base main --head develop \
              --title 'release: promote develop to main' \
              --body 'Human review only. jskorlol must approve this exact head and merge it; automation never merges main.')
            number=${url##*/}
          else
            number=$(printf '%s' "$prs" | jq -r '.[0].number')
            gh pr edit "$number" --title 'release: promote develop to main' \
              --body 'Human review only. jskorlol must approve this exact head and merge it; automation never merges main.'
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          printf '%s' "$pr" | jq -e \
            --arg head "$DEVELOP_SHA" --arg base "$MAIN_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
              .state == "open" and
              .base.ref == "main" and .base.sha == $base and
              .head.ref == "develop" and .head.sha == $head and
              .head.repo.full_name == $repository and
              .user.login == "github-actions[bot]"
            ' >/dev/null
          {
            printf 'head_sha=%s\n' "$DEVELOP_SHA"
            printf 'pull_request_number=%s\n' "$number"
          } >>"$GITHUB_OUTPUT"

  dispatch:
    name: dispatch
    if: >-
      always() && vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.mode == 'sync' ||
       needs.resolve.outputs.mode == 'promotion') &&
      (needs.propose-sync.result == 'success' ||
       needs.promote.result == 'success')
    needs: [resolve, propose-sync, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Dispatch exact-head CI and development publication
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          PROMOTION_HEAD: ${{ needs.promote.outputs.head_sha }}
          PROMOTION_PR: ${{ needs.promote.outputs.pull_request_number }}
          SYNC_HEAD: ${{ needs.propose-sync.outputs.head_sha }}
          SYNC_PR: ${{ needs.propose-sync.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          case "$MODE" in
            sync)
              kind=sync-main
              head=$SYNC_HEAD
              number=$SYNC_PR
              ;;
            promotion)
              kind=promotion
              head=$PROMOTION_HEAD
              number=$PROMOTION_PR
              ;;
            *) echo 'unsupported dispatch mode' >&2; exit 1 ;;
          esac
          case "$head" in
            *[!0-9a-f]*|'') echo 'head must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#head}" -eq 40 ]
          case "$number" in
            *[!0-9]*|'') echo 'pull request number must be numeric' >&2; exit 1 ;;
          esac
          jq -n --arg kind "$kind" --arg number "$number" --arg head "$head" \
            '{event_type:"automation-ci",client_payload:{kind:$kind,
              pull_request_number:$number,head_sha:$head}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
          if [ "$MODE" = promotion ]; then
            jq -n --arg revision "$head" \
              '{event_type:"development-image",client_payload:{revision:$revision}}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
          fi
          printf "Dispatched \`%s\` CI for PR #%s at \`%s\`.\n" \
            "$kind" "$number" "$head" >>"$GITHUB_STEP_SUMMARY"
