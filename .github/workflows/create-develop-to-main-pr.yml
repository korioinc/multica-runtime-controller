name: Create develop to main PR

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  repository_dispatch:
    types: [automation-ci, create-develop-to-main-pr]
  workflow_dispatch:

permissions: {}

concurrency:
  group: develop-to-main-${{ github.event.pull_request.number || github.event.client_payload.pull_request_number || github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: check-context
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'automation-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      verify_check_id: ${{ steps.checks.outputs.verify_check_id }}
      image_check_id: ${{ steps.checks.outputs.image_check_id }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the exact PR head
        id: resolve
        env:
          DISPATCH_HEAD: ${{ github.event.client_payload.head_sha }}
          DISPATCH_NUMBER: ${{ github.event.client_payload.pull_request_number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            head_sha=$EVENT_HEAD
            number=$EVENT_NUMBER
          else
            head_sha=$DISPATCH_HEAD
            number=$DISPATCH_NUMBER
          fi
          case "$head_sha" in
            [0-9a-f][0-9a-f]*) [ "${#head_sha}" -eq 40 ] ;;
            *) echo 'Invalid head SHA.' >&2; exit 1 ;;
          esac
          pr=$(gh api "repos/$GH_REPO/pulls/$number")
          jq -e --arg head_sha "$head_sha" \
            '.state == "open" and .head.sha == $head_sha and
             (.base.ref == "develop" or .base.ref == "main")' \
            <<<"$pr" >/dev/null
          {
            echo "head_sha=$head_sha"
            echo "pull_request_number=$number"
          } >>"$GITHUB_OUTPUT"
      - name: Create required checks for a bot PR
        id: checks
        if: github.event_name == 'repository_dispatch'
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          verify_id=$(gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name="verify" -f head_sha="$HEAD_SHA" -f status=in_progress --jq .id)
          image_id=$(gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name="runtime-image" -f head_sha="$HEAD_SHA" -f status=in_progress --jq .id)
          {
            echo "verify_check_id=$verify_id"
            echo "image_check_id=$image_id"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Verify repository
        id: run
        continue-on-error: true
        run: make verify
      - name: Finish the bot PR verify check
        if: always() && github.event_name == 'repository_dispatch'
        env:
          CHECK_ID: ${{ needs.context.outputs.verify_check_id }}
          CONCLUSION: ${{ steps.run.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method PATCH "repos/$GH_REPO/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$CONCLUSION" >/dev/null
      - name: Fail when verification failed
        if: steps.run.outcome != 'success'
        run: exit 1

  runtime-image:
    name: runtime-image
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve build arguments
        id: args
        run: |
          set -euo pipefail
          python3 scripts/runtime_versions.py --root "$GITHUB_WORKSPACE" build-args \
            --revision "${{ needs.context.outputs.head_sha }}" --version ci \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build the runtime image
        id: run
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: ${{ steps.args.outputs.value }}
      - name: Finish the bot PR runtime-image check
        if: always() && github.event_name == 'repository_dispatch'
        env:
          CHECK_ID: ${{ needs.context.outputs.image_check_id }}
          CONCLUSION: ${{ steps.run.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method PATCH "repos/$GH_REPO/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion="$CONCLUSION" >/dev/null
      - name: Fail when the image build failed
        if: steps.run.outcome != 'success'
        run: exit 1

  promote:
    name: create-develop-to-main-pr
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'create-develop-to-main-pr') ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release): prepare '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out develop for release preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the next patch release
        id: release
        run: |
          set -euo pipefail
          starting_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge --no-edit origin/main
          result=$(python3 scripts/runtime_versions.py \
            --root "$GITHUB_WORKSPACE" prepare-release --base-ref origin/main)
          printf '%s\n' "$result"
          if ! git diff --quiet -- VERSION; then
            [ "$(git diff --name-only)" = VERSION ]
            version=$(jq -r .release_version.to <<<"$result")
            git add VERSION
            git commit --no-gpg-sign -m "chore(release): prepare v$version"
          fi
          if [ "$(git rev-parse HEAD)" != "$starting_sha" ]; then
            git remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:refs/heads/develop
          fi
          echo "develop_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Maintain one develop to main PR
        env:
          DEVELOP_SHA: ${{ steps.release.outputs.develop_sha }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          develop_sha=$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)
          [ "$develop_sha" = "$DEVELOP_SHA" ]
          compare=$(gh api "repos/$GH_REPO/compare/$main_sha...$develop_sha")
          if [ "$(jq -r .status <<<"$compare")" = identical ]; then
            echo 'develop and main are identical.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prs=$(gh pr list --state open --base main --head develop \
            --json number --limit 2)
          count=$(jq 'length' <<<"$prs")
          [ "$count" -le 1 ]
          if [ "$count" -eq 0 ]; then
            url=$(gh pr create --base main --head develop \
              --title 'release: merge develop into main' \
              --body 'Merges the verified develop branch. Merging this PR publishes the versioned image and GitHub Release.')
            number=${url##*/}
          else
            number=$(jq -r '.[0].number' <<<"$prs")
          fi
          pr=$(gh api "repos/$GH_REPO/pulls/$number")
          head_sha=$(jq -r .head.sha <<<"$pr")
          [ "$head_sha" = "$develop_sha" ]
          jq -n \
            --arg number "$number" \
            --arg head_sha "$head_sha" \
            '{event_type:"automation-ci",client_payload:{pull_request_number:$number,head_sha:$head_sha}}' \
            | gh api --method POST "repos/$GH_REPO/dispatches" --input -
          printf "Promotion PR #%s targets develop '%s'.\n" \
            "$number" "$head_sha" >>"$GITHUB_STEP_SUMMARY"
