name: CLI Version Update

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cli-version-update
  cancel-in-progress: false

jobs:
  update:
    name: update-cli-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TARGET_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Update the Multica CLI and patch version
        id: update
        run: |
          set -euo pipefail
          python3 scripts/runtime_versions.py --root "$TARGET_ROOT" update \
            >"$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"
          if git diff --quiet -- build/runtime-versions.env VERSION; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/runtime_versions.py --root "$TARGET_ROOT" validate \
            --base-ref origin/develop --automation-diff
          echo 'changed=true' >>"$GITHUB_OUTPUT"
      - name: Commit and push the update branch
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          branch=automation/multica-cli-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add build/runtime-versions.env VERSION
          git commit --no-gpg-sign -m 'chore: update Multica CLI version'
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/$branch"
      - name: Create the develop PR and start its checks
        id: pr
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          branch=automation/multica-cli-version
          prs=$(gh pr list --state open --base develop --head "$branch" \
            --json number --limit 2)
          count=$(jq 'length' <<<"$prs")
          [ "$count" -le 1 ]
          if [ "$count" -eq 0 ]; then
            url=$(gh pr create --base develop --head "$branch" \
              --title 'chore: update Multica CLI version' \
              --body 'Updates the Multica CLI pin and increments the release patch version.')
            number=${url##*/}
          else
            number=$(jq -r '.[0].number' <<<"$prs")
          fi
          head_sha=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          jq -n \
            --arg number "$number" \
            --arg head_sha "$head_sha" \
            '{event_type:"automation-ci",client_payload:{pull_request_number:$number,head_sha:$head_sha}}' \
            | gh api --method POST "repos/$GH_REPO/dispatches" --input -
          {
            echo "number=$number"
            echo "head_sha=$head_sha"
          } >>"$GITHUB_OUTPUT"
      - name: Wait for checks and merge into develop
        if: steps.update.outputs.changed == 'true'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          complete=false
          for _ in $(seq 1 100); do
            checks=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100")
            failed=$(jq '[.check_runs[] | select(
              (.name == "verify" or .name == "runtime-image") and
              .status == "completed" and .conclusion != "success"
            )] | length' <<<"$checks")
            [ "$failed" -eq 0 ] || {
              echo 'A required check failed.' >&2
              exit 1
            }
            passed=$(jq '[.check_runs[] | select(
              (.name == "verify" or .name == "runtime-image") and
              .status == "completed" and .conclusion == "success"
            ) | .name] | unique | length' <<<"$checks")
            if [ "$passed" -eq 2 ]; then
              complete=true
              break
            fi
            sleep 30
          done
          [ "$complete" = true ] || {
            echo 'Timed out waiting for verify and runtime-image.' >&2
            exit 1
          }
          response=$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$HEAD_SHA" -f merge_method=squash)
          jq -e '.merged == true' <<<"$response" >/dev/null
          develop_sha=$(jq -r .sha <<<"$response")
          gh api --method DELETE \
            "repos/$GH_REPO/git/refs/heads/automation/multica-cli-version" || true
          jq -n \
            --arg develop_sha "$develop_sha" \
            '{event_type:"create-develop-to-main-pr",client_payload:{develop_sha:$develop_sha}}' \
            | gh api --method POST "repos/$GH_REPO/dispatches" --input -
          printf "Merged PR #%s at '%s' and requested the develop-to-main PR.\n" \
            "$PR_NUMBER" "$develop_sha" >>"$GITHUB_STEP_SUMMARY"
