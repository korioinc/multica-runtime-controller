name: Runtime Version Update

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: runtime-version-update
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      updates: ${{ steps.check.outputs.updates }}
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current release to be complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          version=$(cat VERSION)
          revision=$(git rev-parse HEAD)
          python3 scripts/runtime_versions.py release-preflight \
            --version "$version" --revision "$revision" --live \
            --allow-same-identity
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$version" --revision "$revision" --live \
            --format json | jq -r .state)
          [ "$state" = latest_digest_matched ] || {
            printf 'current release is incomplete: %s\n' "$state" >&2
            exit 1
          }
      - name: Check official stable sources
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -eu
          python3 scripts/runtime_versions.py check --format json >"$RUNNER_TEMP/versions.json"
          updates=$(jq -c .updates "$RUNNER_TEMP/versions.json")
          count=$(jq '.updates | length' "$RUNNER_TEMP/versions.json")
          {
            echo "updates=$updates"
            if [ "$count" -eq 0 ]; then echo 'has_updates=false'; else echo 'has_updates=true'; fi
          } >>"$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            printf "Outcome: \`up_to_date\`; updates: \`[]\`.\n" >>"$GITHUB_STEP_SUMMARY"
          else
            printf "Outcome: \`%s update(s)\`; details: \`%s\`.\n" \
              "$count" "$updates" >>"$GITHUB_STEP_SUMMARY"
          fi

  propose:
    name: propose
    needs: resolve
    if: needs.resolve.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out latest main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the checked-out release boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(cat VERSION)
          revision=$(git rev-parse HEAD)
          python3 scripts/runtime_versions.py release-preflight \
            --version "$version" --revision "$revision" --live \
            --allow-same-identity
          state=$(python3 scripts/runtime_versions.py release-state \
            --version "$version" --revision "$revision" --live \
            --format json | jq -r .state)
          [ "$state" = latest_digest_matched ] || {
            printf 'checked-out release is incomplete: %s\n' "$state" >&2
            exit 1
          }
      - name: Update the exact two version files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 scripts/runtime_versions.py update --write
          python3 scripts/runtime_versions.py validate \
            --base-ref origin/main --automation-diff
      - name: Commit and push the bot-owned branch
        env:
          AUTOMATION_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=automation/runtime-versions
          bot_login='github-actions[bot]'
          bot_email='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name "$bot_login"
          git config user.email "$bot_email"
          git checkout -B "$branch"
          git add VERSION build/runtime-versions.env
          git commit --no-gpg-sign -m 'chore: update runtime versions'

          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            prs=$(gh pr list --state open --head "$branch" --json number --limit 10)
            [ "$(printf '%s' "$prs" | jq 'length')" -eq 1 ] || {
              echo 'bot branch exists without exactly one open PR' >&2
              exit 1
            }
            number=$(printf '%s' "$prs" | jq -r '.[0].number')
            existing=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
            printf '%s' "$existing" | jq -e \
              --arg branch "$branch" \
              --arg repository "$GITHUB_REPOSITORY" '
                .state == "open" and
                .user.login == "github-actions[bot]" and
                .head.ref == $branch and
                .head.repo.full_name == $repository and
                .base.ref == "main"
              ' >/dev/null
            remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$remote_sha")
            printf '%s' "$remote_commit" | jq -e '
              .author.login == "github-actions[bot]" and
              .committer.login == "github-actions[bot]"
            ' >/dev/null
          fi

          askpass=$RUNNER_TEMP/git-askpass
          cat >"$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$AUTOMATION_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0700 "$askpass"
          if [ -n "$remote_sha" ]; then
            lease="--force-with-lease=refs/heads/$branch:$remote_sha"
          else
            lease="--force-with-lease=refs/heads/$branch:"
          fi
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "$lease" "https://github.com/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$branch"
      - name: Create or update one PR and dispatch exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES: ${{ needs.resolve.outputs.updates }}
        run: |
          # jq programs and Markdown format strings are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          branch=automation/runtime-versions
          prs=$(gh pr list --state open --head "$branch" --json number --limit 10)
          count=$(printf '%s' "$prs" | jq 'length')
          [ "$count" -le 1 ] || { echo 'duplicate updater PRs detected' >&2; exit 1; }
          version=$(cat VERSION)
          cat >"$RUNNER_TEMP/pr-body.md" <<EOF
          ## Runtime version update

          Automated stable-source changes: \`$UPDATES\`

          Target controller release: \`$version\`

          Changed files are restricted to \`VERSION\` and \`build/runtime-versions.env\`.
          The exact PR head must pass the \`verify\` and \`runtime-image\` jobs; no workflow has a ruleset bypass.
          EOF
          if [ "$count" -eq 0 ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore: release runtime $version" \
              --body-file "$RUNNER_TEMP/pr-body.md")
            number=${url##*/}
          else
            number=$(printf '%s' "$prs" | jq -r '.[0].number')
            gh pr edit "$number" --title "chore: release runtime $version" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi

          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" \
            --jq .object.sha)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          printf '%s' "$pr" | jq -e \
            --arg branch "$branch" \
            --arg head "$head_sha" \
            --arg repository "$GITHUB_REPOSITORY" '
              .state == "open" and
              .user.login == "github-actions[bot]" and
              .base.ref == "main" and
              .head.ref == $branch and
              .head.sha == $head and
              .head.repo.full_name == $repository
            ' >/dev/null

          jq -n \
            --arg ref "$branch" \
            --arg number "$number" \
            --arg head "$head_sha" \
            '{ref:$ref,inputs:{pull_request_number:$number,head_sha:$head}}' \
            | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
                --input -
          printf "Updater PR: #%s; head: \`%s\`; target release: \`%s\`; CI dispatched.\n" \
            "$number" "$head_sha" "$version" >>"$GITHUB_STEP_SUMMARY"
