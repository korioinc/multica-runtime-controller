name: Runtime Version Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [automation/runtime-versions]

permissions: {}

concurrency:
  group: runtime-version-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      pull_request_number: ${{ steps.merge.outputs.pull_request_number }}
    steps:
      - name: Revalidate the triggering run and merge the exact PR head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_ACTOR: ${{ github.event.workflow_run.actor.login }}
          EVENT_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          # jq programs and expected JSON are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          case "$RUN_ID" in
            *[!0-9]*|'') echo 'run ID must be numeric' >&2; exit 1 ;;
          esac
          case "$RUN_ATTEMPT" in
            *[!0-9]*|'') echo 'run attempt must be numeric' >&2; exit 1 ;;
          esac
          case "$EVENT_HEAD_SHA" in
            *[!0-9a-f]*|'') echo 'run head must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#EVENT_HEAD_SHA}" -eq 40 ] || {
            echo 'run head must contain exactly 40 characters' >&2
            exit 1
          }
          [ "$EVENT_HEAD_BRANCH" = automation/runtime-versions ]
          [ "$EVENT_ACTOR" = 'github-actions[bot]' ]
          [ "$EVENT_TRIGGERING_ACTOR" = 'github-actions[bot]' ]

          expected_workflow_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          printf '%s' "$run" | jq -e \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson workflow_id "$expected_workflow_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" '
              .id == $run_id and
              .run_attempt == $run_attempt and
              .workflow_id == $workflow_id and
              .name == "CI" and
              .path == ".github/workflows/ci.yml" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .repository.full_name == $repository and
              .head_branch == "automation/runtime-versions" and
              .head_sha == $head and
              .actor.login == "github-actions[bot]" and
              .triggering_actor.login == "github-actions[bot]"
            ' >/dev/null

          jobs_pages=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100")
          expected_names='["context","runtime-image","verify"]'
          actual_names=$(printf '%s' "$jobs_pages" | jq -c \
            '[.[].jobs[].name] | sort')
          [ "$actual_names" = "$expected_names" ] || {
            printf 'unexpected CI jobs: %s\n' "$actual_names" >&2
            exit 1
          }
          printf '%s' "$jobs_pages" | jq -e '
            [.[].jobs[]] as $jobs |
            ($jobs | length) == 3 and
            all($jobs[]; .status == "completed" and .conclusion == "success")
          ' >/dev/null

          prs=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$EVENT_HEAD_SHA/pulls")
          matches=$(printf '%s' "$prs" | jq -c \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" '[
              .[] | select(
                .base.ref == "main" and
                .head.ref == "automation/runtime-versions" and
                .head.repo.full_name == $repository and
                .head.sha == $head and
                .user.login == "github-actions[bot]" and
                .commits == 1
              )
            ]')
          [ "$(printf '%s' "$matches" | jq 'length')" -eq 1 ] || {
            echo 'expected exactly one matching updater PR' >&2
            exit 1
          }
          pull_request_number=$(printf '%s' "$matches" | jq -r '.[0].number')
          state=$(printf '%s' "$matches" | jq -r '.[0].state')
          merged=$(printf '%s' "$matches" | jq -r '.[0].merged')

          files=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$pull_request_number/files?per_page=100" \
            --jq '.[].filename' | LC_ALL=C sort)
          expected=$(printf '%s\n' VERSION build/runtime-versions.env | LC_ALL=C sort)
          [ "$files" = "$expected" ] || {
            printf 'unexpected updater PR files:\n%s\n' "$files" >&2
            exit 1
          }
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EVENT_HEAD_SHA")
          printf '%s' "$commit" | jq -e '
            .author.login == "github-actions[bot]" and
            .committer.login == "github-actions[bot]"
          ' >/dev/null

          if [ "$state" = open ] && [ "$merged" = false ]; then
            compare=$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/main...$EVENT_HEAD_SHA")
            printf '%s' "$compare" | jq -e '.behind_by == 0' >/dev/null
            gh pr merge "$pull_request_number" \
              --repo "$GITHUB_REPOSITORY" \
              --squash --delete-branch \
              --match-head-commit "$EVENT_HEAD_SHA"
          elif [ "$state" != closed ] || [ "$merged" != true ]; then
            echo 'updater PR is neither open nor already merged' >&2
            exit 1
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request_number")
          printf '%s' "$pr" | jq -e \
            --arg head "$EVENT_HEAD_SHA" '
              .state == "closed" and
              .merged == true and
              .head.sha == $head and
              (.merge_commit_sha | test("^[0-9a-f]{40}$"))
            ' >/dev/null
          merge_sha=$(printf '%s' "$pr" | jq -r .merge_commit_sha)
          ancestry=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$merge_sha...main")
          printf '%s' "$ancestry" | jq -e '
            (.status == "identical" or .status == "ahead") and .behind_by == 0
          ' >/dev/null
          {
            printf 'merge_sha=%s\n' "$merge_sha"
            printf 'pull_request_number=%s\n' "$pull_request_number"
          } >>"$GITHUB_OUTPUT"
          printf 'Merged updater PR #%s at %s.\n' \
            "$pull_request_number" "$merge_sha" >>"$GITHUB_STEP_SUMMARY"

  dispatch-release:
    name: dispatch-release
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch release for the exact merge identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
        run: |
          # jq programs and Python regular expressions are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          case "$MERGE_SHA" in
            *[!0-9a-f]*|'') echo 'merge SHA must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#MERGE_SHA}" -eq 40 ]

          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MERGE_SHA...main")
          printf '%s' "$ancestry" | jq -e '
            (.status == "identical" or .status == "ahead") and .behind_by == 0
          ' >/dev/null

          encoded=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$MERGE_SHA" --jq .content)
          version=$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode | tr -d '\n')
          python3 - "$version" "$MERGE_SHA" <<'PY'
          import re
          import sys

          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1]) is None:
              raise SystemExit("VERSION at merge is not stable SemVer")
          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[2]) is None:
              raise SystemExit("merge revision is not a full lowercase SHA")
          PY

          jq -n \
            --arg version "$version" \
            --arg revision "$MERGE_SHA" \
            '{ref:"main",inputs:{version:$version,revision:$revision}}' \
            | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
                --input -
          printf 'Dispatched release %s for %s.\n' \
            "$version" "$MERGE_SHA" >>"$GITHUB_STEP_SUMMARY"
