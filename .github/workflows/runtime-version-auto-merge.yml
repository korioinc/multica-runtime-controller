name: Runtime Version Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: runtime-version-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'repository_dispatch' &&
      (startsWith(github.event.workflow_run.display_title, 'CI automation runtime-update ') ||
       startsWith(github.event.workflow_run.display_title, 'CI automation release-patch ') ||
       startsWith(github.event.workflow_run.display_title, 'CI automation sync-main '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      pull_request_number: ${{ steps.merge.outputs.pull_request_number }}
    steps:
      - name: Revalidate trusted CI metadata and merge the exact PR head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_ACTOR: ${{ github.event.workflow_run.actor.login }}
          EVENT_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          # jq programs and expected JSON are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          case "$RUN_ID" in
            *[!0-9]*|'') echo 'run ID must be numeric' >&2; exit 1 ;;
          esac
          case "$RUN_ATTEMPT" in
            *[!0-9]*|'') echo 'run attempt must be numeric' >&2; exit 1 ;;
          esac
          case "$EVENT_WORKFLOW_SHA" in
            *[!0-9a-f]*|'') echo 'workflow SHA must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#EVENT_WORKFLOW_SHA}" -eq 40 ]
          [ "$EVENT_HEAD_BRANCH" = main ]
          [ "$EVENT_ACTOR" = 'github-actions[bot]' ]
          [ "$EVENT_TRIGGERING_ACTOR" = 'github-actions[bot]' ]

          expected_workflow_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          printf '%s' "$run" | jq -e \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson workflow_id "$expected_workflow_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$EVENT_WORKFLOW_SHA" '
              .id == $run_id and
              .run_attempt == $run_attempt and
              .workflow_id == $workflow_id and
              .name == "CI" and
              .path == ".github/workflows/ci.yml" and
              .event == "repository_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .repository.full_name == $repository and
              .head_branch == "main" and
              .head_sha == $workflow_sha and
              .actor.login == "github-actions[bot]" and
              .triggering_actor.login == "github-actions[bot]"
            ' >/dev/null
          live_main=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$live_main" = "$EVENT_WORKFLOW_SHA" ] || {
            printf 'trusted workflow moved: run=%s live-main=%s\n' \
              "$EVENT_WORKFLOW_SHA" "$live_main" >&2
            exit 1
          }

          identity=$(printf '%s' "$run" | jq -er '
            .display_title |
            capture("^CI automation (?<kind>runtime-update|release-patch|sync-main) PR-(?<number>[1-9][0-9]*) SHA-(?<head>[0-9a-f]{40})$") |
            [.kind, .number, .head] | @tsv
          ')
          IFS=$'\t' read -r automation_kind pull_request_number automation_head <<EOF
          $identity
          EOF
          case "$automation_head" in
            *[!0-9a-f]*|'') echo 'automation head must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#automation_head}" -eq 40 ]
          case "$pull_request_number" in
            *[!0-9]*|'') echo 'pull request number must be numeric' >&2; exit 1 ;;
          esac

          case "$automation_kind" in
            runtime-update)
              expected_branch=automation/runtime-versions
              expected_files=$(printf '%s\n' VERSION build/runtime-versions.env | LC_ALL=C sort)
              expected_commit_count=1
              merge_method=squash
              ;;
            release-patch)
              expected_branch=automation/release-patch
              expected_files=VERSION
              expected_commit_count=1
              merge_method=squash
              ;;
            sync-main)
              expected_branch=automation/sync-main
              expected_files=
              expected_commit_count=2
              merge_method=merge
              ;;
          esac

          jobs_pages=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100")
          expected_names='["automation-runtime-image","automation-runtime-image-amd64","automation-runtime-image-arm64","automation-verify","context","publish-checks"]'
          actual_names=$(printf '%s' "$jobs_pages" | jq -c \
            '[.[].jobs[].name] | sort')
          [ "$actual_names" = "$expected_names" ] || {
            printf 'unexpected CI jobs: %s\n' "$actual_names" >&2
            exit 1
          }
          printf '%s' "$jobs_pages" | jq -e '
            [.[].jobs[]] as $jobs |
            ($jobs | length) == 6 and
            all($jobs[]; .status == "completed" and .conclusion == "success")
          ' >/dev/null

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request_number")
          printf '%s' "$pr" | jq -e \
            --argjson number "$pull_request_number" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$expected_branch" \
            --arg head "$automation_head" \
            --argjson expected_commit_count "$expected_commit_count" '
              .number == $number and
              .base.ref == "develop" and
              .head.ref == $branch and
              .head.repo.full_name == $repository and
              .head.sha == $head and
              .user.login == "github-actions[bot]" and
              .commits == $expected_commit_count
            ' >/dev/null
          state=$(printf '%s' "$pr" | jq -r .state)
          merged=$(printf '%s' "$pr" | jq -r .merged)
          base_sha=$(printf '%s' "$pr" | jq -r .base.sha)

          files=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$pull_request_number/files?per_page=100" \
            --jq '.[].filename' | LC_ALL=C sort)
          [ "$files" = "$expected_files" ] || {
            printf 'unexpected automation PR files:\n%s\n' "$files" >&2
            exit 1
          }
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$automation_head")
          printf '%s' "$commit" | jq -e '
            .author.login == "github-actions[bot]" and
            .committer.login == "github-actions[bot]"
          ' >/dev/null
          if [ "$automation_kind" = sync-main ]; then
            printf '%s' "$commit" | jq -e \
              --arg develop "$base_sha" \
              --arg main "$EVENT_WORKFLOW_SHA" '
                (.parents | length) == 2 and
                .parents[0].sha == $develop and
                .parents[1].sha == $main
              ' >/dev/null
          fi

          if [ "$state" = open ] && [ "$merged" = false ]; then
            compare=$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/develop...$automation_head")
            printf '%s' "$compare" | jq -e '.behind_by == 0' >/dev/null
            if [ "$merge_method" = merge ]; then
              gh pr merge "$pull_request_number" \
                --repo "$GITHUB_REPOSITORY" \
                --merge --delete-branch \
                --match-head-commit "$automation_head"
            else
              gh pr merge "$pull_request_number" \
                --repo "$GITHUB_REPOSITORY" \
                --squash --delete-branch \
                --match-head-commit "$automation_head"
            fi
          elif [ "$state" != closed ] || [ "$merged" != true ]; then
            echo 'automation PR is neither open nor already merged' >&2
            exit 1
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request_number")
          printf '%s' "$pr" | jq -e \
            --arg head "$automation_head" '
              .state == "closed" and
              .merged == true and
              .head.sha == $head and
              (.merge_commit_sha | test("^[0-9a-f]{40}$"))
            ' >/dev/null
          merge_sha=$(printf '%s' "$pr" | jq -r .merge_commit_sha)
          ancestry=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$merge_sha...develop")
          printf '%s' "$ancestry" | jq -e '
            (.status == "identical" or .status == "ahead") and .behind_by == 0
          ' >/dev/null
          {
            printf 'merge_sha=%s\n' "$merge_sha"
            printf 'pull_request_number=%s\n' "$pull_request_number"
          } >>"$GITHUB_OUTPUT"
          printf 'Merged automation PR #%s at %s.\n' \
            "$pull_request_number" "$merge_sha" >>"$GITHUB_STEP_SUMMARY"

  dispatch-develop:
    name: dispatch-develop
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Dispatch trusted reconciliation for the exact develop merge
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
        run: |
          # jq programs are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          case "$MERGE_SHA" in
            *[!0-9a-f]*|'') echo 'merge SHA must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#MERGE_SHA}" -eq 40 ]

          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MERGE_SHA...develop")
          printf '%s' "$ancestry" | jq -e '
            (.status == "identical" or .status == "ahead") and .behind_by == 0
          ' >/dev/null

          jq -n \
            --arg revision "$MERGE_SHA" \
            '{event_type:"reconcile-develop",client_payload:{revision:$revision}}' \
            | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -
          printf 'Dispatched trusted reconciliation for %s.\n' \
            "$MERGE_SHA" >>"$GITHUB_STEP_SUMMARY"
