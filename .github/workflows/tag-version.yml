name: Tag controller version

on:
  push:
    branches: [main]

permissions: {}
concurrency:
  group: controller-version-tag
  cancel-in-progress: false
  queue: max

jobs:
  tag:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      BEFORE_REVISION: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tagging before making a release request
        run: |
          shellcheck -x scripts/lib/version.sh .github/scripts/*.sh
      - name: Tag the changed version and request its exact commit
        run: >-
          .github/scripts/tag-version.sh --root "$GITHUB_WORKSPACE"
          --before "$BEFORE_REVISION" --revision "$GITHUB_SHA"
