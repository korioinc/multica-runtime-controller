name: Development Image

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: development-image
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Verify repository
        run: make verify

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      REVISION: ${{ github.sha }}
    steps:
      - name: Check out exact development revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim runner disk for the cold multi-platform build
        run: |
          set -euo pipefail
          before_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          after_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Reclaimed %s KiB; %s KiB available on /.\n' \
            "$((after_kb - before_kb))" "$after_kb"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve non-secret build arguments
        id: build-args
        run: |
          set -eu
          python3 scripts/runtime_versions.py build-args \
            --format json --revision "$REVISION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build and push development image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:develop-${{ github.sha }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: |
            type=gha,scope=runtime-develop
            type=gha,scope=runtime-main
          cache-to: type=gha,mode=max,scope=runtime-develop
          provenance: mode=max
          sbom: true
      - name: Record development image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ]
          {
            printf "Development revision: \`%s\`\n" "$REVISION"
            printf "Manifest digest: \`%s\`\n" "$DIGEST"
            printf "Moving reference: \`%s:develop\`\n" "$IMAGE"
            printf "Immutable commit reference: \`%s:develop-%s\`\n" "$IMAGE" "$REVISION"
          } >>"$GITHUB_STEP_SUMMARY"
