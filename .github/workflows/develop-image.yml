name: Development Image
run-name: Development image ${{ github.event.client_payload.revision }}

on:
  repository_dispatch:
    types: [development-image]

permissions: {}

concurrency:
  group: development-image
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      build_args: ${{ steps.build-args.outputs.value }}
      revision: ${{ steps.context.outputs.revision }}
    steps:
      - name: Resolve the exact development revision
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_REVISION: ${{ github.event.client_payload.revision }}
        run: |
          set -euo pipefail
          [ "$EVENT_REF" = refs/heads/main ]
          live_main=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$EVENT_SHA" = "$live_main" ] || {
            printf 'trusted workflow moved: event=%s live-main=%s\n' \
              "$EVENT_SHA" "$live_main" >&2
            exit 1
          }
          revision=$INPUT_REVISION
          case "$revision" in
            *[!0-9a-f]*|'') echo 'revision must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          [ "${#revision}" -eq 40 ]
          live_head=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          [ "$live_head" = "$revision" ] || {
            printf 'develop moved: live=%s input=%s\n' \
              "$live_head" "$revision" >&2
            exit 1
          }
          printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.context.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Verify repository
        run: make verify
      - name: Resolve non-secret build arguments without package credentials
        id: build-args
        env:
          REVISION: ${{ steps.context.outputs.revision }}
        run: |
          set -eu
          python3 scripts/runtime_versions.py build-args \
            --format json --revision "$REVISION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/korioinc/multica-runtime-controller
      REVISION: ${{ needs.verify.outputs.revision }}
    steps:
      - name: Check out exact development revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim runner disk for the cold multi-platform build
        run: |
          set -euo pipefail
          before_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          after_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Reclaimed %s KiB; %s KiB available on /.\n' \
            "$((after_kb - before_kb))" "$after_kb"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push development image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:develop-${{ needs.verify.outputs.revision }}
          build-args: ${{ needs.verify.outputs.build_args }}
          cache-from: |
            type=gha,scope=runtime-develop
            type=gha,scope=runtime-main
          cache-to: type=gha,mode=max,scope=runtime-develop
          provenance: mode=max
          sbom: true
      - name: Record development image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ]
          {
            printf "Development revision: \`%s\`\n" "$REVISION"
            printf "Manifest digest: \`%s\`\n" "$DIGEST"
            printf "Moving reference: \`%s:develop\`\n" "$IMAGE"
            printf "Immutable commit reference: \`%s:develop-%s\`\n" "$IMAGE" "$REVISION"
          } >>"$GITHUB_STEP_SUMMARY"
