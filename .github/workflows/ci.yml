name: CI
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('CI automation {0} PR-{1} SHA-{2}', github.event.client_payload.kind, github.event.client_payload.pull_request_number, github.event.client_payload.head_sha)
      || format('CI {0}', github.event_name) }}

on:
  pull_request:
  push:
    branches: [main, develop]
  repository_dispatch:
    types: [automation-ci]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.client_payload.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      automation_kind: ${{ steps.resolve.outputs.automation_kind }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      cache_scope: ${{ steps.resolve.outputs.cache_scope }}
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
    steps:
      - name: Resolve and validate the immutable CI context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          INPUT_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          INPUT_KIND: ${{ github.event.client_payload.kind }}
          INPUT_PULL_REQUEST_NUMBER: ${{ github.event.client_payload.pull_request_number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            repository_dispatch)
              [ "$EVENT_REF" = refs/heads/main ] || {
                printf 'automation CI must run from trusted main, got %s\n' \
                  "$EVENT_REF" >&2
                exit 1
              }
              case "$EVENT_SHA" in
                *[!0-9a-f]*|'') echo 'workflow SHA must be lowercase hexadecimal' >&2; exit 1 ;;
              esac
              [ "${#EVENT_SHA}" -eq 40 ]
              live_main=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
              [ "$EVENT_SHA" = "$live_main" ] || {
                printf 'trusted workflow moved: event=%s live-main=%s\n' \
                  "$EVENT_SHA" "$live_main" >&2
                exit 1
              }
              case "$INPUT_HEAD_SHA" in
                *[!0-9a-f]*|'') echo 'head_sha must be lowercase hexadecimal' >&2; exit 1 ;;
              esac
              [ "${#INPUT_HEAD_SHA}" -eq 40 ] || {
                echo 'head_sha must contain exactly 40 characters' >&2
                exit 1
              }
              case "$INPUT_PULL_REQUEST_NUMBER" in
                *[!0-9]*|'') echo 'pull_request_number must be numeric' >&2; exit 1 ;;
              esac
              pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PULL_REQUEST_NUMBER")
              base_sha=$(printf '%s' "$pr" | jq -r .base.sha)
              case "$INPUT_KIND" in
                runtime-update)
                  if ! { [ "$EVENT_ACTOR" = 'github-actions[bot]' ] && \
                    [ "$EVENT_TRIGGERING_ACTOR" = 'github-actions[bot]' ]; }; then
                      printf 'unexpected runtime dispatch actor: actor=%s triggering=%s\n' \
                        "$EVENT_ACTOR" "$EVENT_TRIGGERING_ACTOR" >&2
                      exit 1
                  fi
                  printf '%s' "$pr" | jq -e \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg head "$INPUT_HEAD_SHA" '
                      .state == "open" and
                      .base.ref == "develop" and
                      .head.ref == "automation/runtime-versions" and
                      .head.repo.full_name == $repository and
                      .head.sha == $head and
                      .user.login == "github-actions[bot]" and
                      .commits == 1
                    ' >/dev/null
                  files=$(gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PULL_REQUEST_NUMBER/files?per_page=100" \
                    --jq '.[].filename' | LC_ALL=C sort)
                  expected=$(printf '%s\n' VERSION build/runtime-versions.env | LC_ALL=C sort)
                  [ "$files" = "$expected" ] || {
                    printf 'unexpected runtime update files:\n%s\n' "$files" >&2
                    exit 1
                  }
                  commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_HEAD_SHA")
                  printf '%s' "$commit" | jq -e '
                    .author.login == "github-actions[bot]" and
                    .committer.login == "github-actions[bot]"
                  ' >/dev/null
                  compare=$(gh api \
                    "repos/$GITHUB_REPOSITORY/compare/develop...$INPUT_HEAD_SHA")
                  printf '%s' "$compare" | jq -e '.behind_by == 0' >/dev/null
                  cache_scope="runtime-update-$INPUT_PULL_REQUEST_NUMBER"
                  ;;
                release-patch)
                  if ! { [ "$EVENT_ACTOR" = 'github-actions[bot]' ] && \
                    [ "$EVENT_TRIGGERING_ACTOR" = 'github-actions[bot]' ]; }; then
                      printf 'unexpected patch dispatch actor: actor=%s triggering=%s\n' \
                        "$EVENT_ACTOR" "$EVENT_TRIGGERING_ACTOR" >&2
                      exit 1
                  fi
                  printf '%s' "$pr" | jq -e \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg head "$INPUT_HEAD_SHA" '
                      .state == "open" and
                      .base.ref == "develop" and
                      .head.ref == "automation/release-patch" and
                      .head.repo.full_name == $repository and
                      .head.sha == $head and
                      .user.login == "github-actions[bot]" and
                      .commits == 1
                    ' >/dev/null
                  files=$(gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PULL_REQUEST_NUMBER/files?per_page=100" \
                    --jq '.[].filename')
                  [ "$files" = VERSION ]
                  commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_HEAD_SHA")
                  printf '%s' "$commit" | jq -e '
                    .author.login == "github-actions[bot]" and
                    .committer.login == "github-actions[bot]"
                  ' >/dev/null
                  compare=$(gh api \
                    "repos/$GITHUB_REPOSITORY/compare/develop...$INPUT_HEAD_SHA")
                  printf '%s' "$compare" | jq -e \
                    '.behind_by == 0 and .ahead_by == 1' >/dev/null
                  base_version=$(gh api \
                    "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$base_sha" \
                    --jq .content | tr -d '\n' | base64 --decode | tr -d '\n')
                  head_version=$(gh api \
                    "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$INPUT_HEAD_SHA" \
                    --jq .content | tr -d '\n' | base64 --decode | tr -d '\n')
                  python3 - "$base_version" "$head_version" <<'PY'
          import re
          import sys

          pattern = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          values = []
          for value in sys.argv[1:]:
              match = pattern.fullmatch(value)
              if match is None:
                  raise SystemExit(f"invalid stable SemVer: {value}")
              values.append(tuple(int(part) for part in match.groups()))
          if values[1] != (values[0][0], values[0][1], values[0][2] + 1):
              raise SystemExit("release patch must increment exactly once")
          PY
                  cache_scope="release-patch-$INPUT_PULL_REQUEST_NUMBER"
                  ;;
                sync-main)
                  if ! { [ "$EVENT_ACTOR" = 'github-actions[bot]' ] && \
                    [ "$EVENT_TRIGGERING_ACTOR" = 'github-actions[bot]' ]; }; then
                      printf 'unexpected sync dispatch actor: actor=%s triggering=%s\n' \
                        "$EVENT_ACTOR" "$EVENT_TRIGGERING_ACTOR" >&2
                      exit 1
                  fi
                  printf '%s' "$pr" | jq -e \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg head "$INPUT_HEAD_SHA" '
                      .state == "open" and
                      .base.ref == "develop" and
                      .head.ref == "automation/sync-main" and
                      .head.repo.full_name == $repository and
                      .head.sha == $head and
                      .user.login == "github-actions[bot]" and
                      .commits == 1
                    ' >/dev/null
                  files=$(gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PULL_REQUEST_NUMBER/files?per_page=100" \
                    --jq '.[].filename')
                  [ -z "$files" ] || {
                    printf 'sync PR unexpectedly changes files:\n%s\n' "$files" >&2
                    exit 1
                  }
                  commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_HEAD_SHA")
                  printf '%s' "$commit" | jq -e \
                    --arg develop "$base_sha" \
                    --arg main "$live_main" '
                      .author.login == "github-actions[bot]" and
                      .committer.login == "github-actions[bot]" and
                      (.parents | length) == 2 and
                      .parents[0].sha == $develop and
                      .parents[1].sha == $main
                    ' >/dev/null
                  compare=$(gh api \
                    "repos/$GITHUB_REPOSITORY/compare/develop...$INPUT_HEAD_SHA")
                  printf '%s' "$compare" | jq -e \
                    '.behind_by == 0 and .ahead_by == 1' >/dev/null
                  cache_scope="sync-main-$INPUT_PULL_REQUEST_NUMBER"
                  ;;
                promotion)
                  printf '%s' "$pr" | jq -e \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg head "$INPUT_HEAD_SHA" '
                      .state == "open" and
                      .base.ref == "main" and
                      .head.ref == "develop" and
                      .head.repo.full_name == $repository and
                      .head.sha == $head
                    ' >/dev/null
                  live_head=$(gh api \
                    "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
                  [ "$live_head" = "$INPUT_HEAD_SHA" ] || {
                    printf 'develop moved: live=%s input=%s\n' \
                      "$live_head" "$INPUT_HEAD_SHA" >&2
                      exit 1
                  }
                  live_main=$(gh api \
                    "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
                  [ "$live_main" = "$base_sha" ] || {
                    printf 'main moved: live=%s PR-base=%s\n' \
                      "$live_main" "$base_sha" >&2
                    exit 1
                  }
                  compare=$(gh api \
                    "repos/$GITHUB_REPOSITORY/compare/main...$INPUT_HEAD_SHA")
                  printf '%s' "$compare" | jq -e '.ahead_by > 0' >/dev/null
                  cache_scope="promotion-$INPUT_PULL_REQUEST_NUMBER"
                  ;;
                *)
                  printf 'unsupported automation kind: %s\n' "$INPUT_KIND" >&2
                  exit 1
                  ;;
              esac

              automation_kind=$INPUT_KIND
              checkout_sha=$INPUT_HEAD_SHA
              pull_request_number=$INPUT_PULL_REQUEST_NUMBER
              ;;
            pull_request)
              automation_kind=none
              base_sha=$PR_BASE_SHA
              checkout_sha=$EVENT_SHA
              pull_request_number=$PR_NUMBER
              cache_scope="runtime-pr-$PR_NUMBER"
              ;;
            push)
              automation_kind=none
              base_sha=$PUSH_BEFORE_SHA
              checkout_sha=$EVENT_SHA
              pull_request_number=
              cache_scope=runtime-main
              ;;
            *)
              printf 'unsupported event: %s\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            printf 'automation_kind=%s\n' "$automation_kind"
            printf 'base_sha=%s\n' "$base_sha"
            printf 'cache_scope=%s\n' "$cache_scope"
            printf 'checkout_sha=%s\n' "$checkout_sha"
            printf 'pull_request_number=%s\n' "$pull_request_number"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: ${{ github.event_name == 'repository_dispatch' && 'automation-verify' || 'verify' }}
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the validated source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.checkout_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - name: Validate the automation-only diff
        if: needs.context.outputs.automation_kind == 'runtime-update'
        env:
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
        run: python3 scripts/runtime_versions.py validate --base-ref "$BASE_SHA" --automation-diff
      - name: Verify repository
        run: make verify

  runtime-image:
    name: ${{ github.event_name == 'repository_dispatch' && 'automation-runtime-image' || 'runtime-image' }}
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the validated source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.checkout_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select image verification scope
        id: scope
        env:
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
          CACHE_SCOPE: ${{ needs.context.outputs.cache_scope }}
        run: |
          set -eu
          if [ -z "$BASE_SHA" ] || \
            [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            build=true
          elif git diff --quiet "$BASE_SHA" HEAD -- \
            Dockerfile .dockerignore VERSION build/runtime-versions.env \
            scripts/install-runtime-tools.sh scripts/runtime-entrypoint.sh \
            scripts/verify-runtime-tools.sh src; then
            build=false
          else
            build=true
          fi
          {
            echo "build=$build"
            echo "cache_scope=$CACHE_SCOPE"
          } >>"$GITHUB_OUTPUT"
          printf 'runtime image build required: %s\n' "$build" >>"$GITHUB_STEP_SUMMARY"
      - name: Reclaim runner disk for the cold multi-platform build
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          before_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          after_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          printf 'Reclaimed %s KiB; %s KiB available on /.\n' \
            "$((after_kb - before_kb))" "$after_kb"
      - name: Set up QEMU
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve non-secret build arguments
        if: steps.scope.outputs.build == 'true'
        id: build-args
        env:
          REVISION: ${{ needs.context.outputs.checkout_sha }}
        run: |
          set -eu
          python3 scripts/runtime_versions.py build-args \
            --format json --revision "$REVISION" \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >"$RUNNER_TEMP/build-args"
          {
            echo 'value<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - name: Build both runtime platforms without pushing
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: |
            type=gha,scope=runtime-main
            type=gha,scope=${{ steps.scope.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.scope.outputs.cache_scope }}
          provenance: false
          sbom: false
      - name: Record successful no-op
        if: steps.scope.outputs.build != 'true'
        run: printf '%s\n' 'No runtime image input changed; the required check is a successful no-op.' >>"$GITHUB_STEP_SUMMARY"

  publish-checks:
    name: publish-checks
    if: >-
      github.event_name == 'repository_dispatch' &&
      needs.verify.result == 'success' &&
      needs.runtime-image.result == 'success'
    needs: [context, verify, runtime-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish source-pinned required checks on the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.context.outputs.checkout_sha }}
          PULL_REQUEST_NUMBER: ${{ needs.context.outputs.pull_request_number }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          # jq programs and Markdown are intentionally literal.
          # shellcheck disable=SC2016
          set -euo pipefail
          live_main=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$WORKFLOW_SHA" = "$live_main" ] || {
            printf 'trusted workflow moved: workflow=%s live-main=%s\n' \
              "$WORKFLOW_SHA" "$live_main" >&2
            exit 1
          }
          pr=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")
          printf '%s' "$pr" | jq -e --arg head "$HEAD_SHA" '
            .state == "open" and .head.sha == $head
          ' >/dev/null

          details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for name in verify runtime-image; do
            jq -n \
              --arg name "$name" \
              --arg head "$HEAD_SHA" \
              --arg details_url "$details_url" \
              --arg workflow_sha "$WORKFLOW_SHA" '
                {
                  name: $name,
                  head_sha: $head,
                  status: "completed",
                  conclusion: "success",
                  details_url: $details_url,
                  output: {
                    title: ("Trusted " + $name + " passed"),
                    summary: ("Validated by the reviewed CI workflow at `" + $workflow_sha + "`.")
                  }
                }
              ' | gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/check-runs" --input - >/dev/null
          done
