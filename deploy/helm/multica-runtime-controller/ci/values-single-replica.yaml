replicaCount: 1
runtime:
  capacity: 20
  extraEnvFrom:
    - secretRef:
        name: provider-env
  extraEnv:
    - name: GH_TOKEN
      valueFrom:
        secretKeyRef:
          name: provider-env
          key: GITHUB_PAT_TOKEN
  pi:
    configMapName: pi-config
    configMapItems:
      - key: agents
        path: agent/AGENTS.md
    packages:
      - npm:pi-mcp-adapter
  extraVolumes:
    - name: codex-home
      projected:
        sources:
          - configMap:
              name: codex-config
          - secret:
              name: codex-auth
  extraVolumeMounts:
    - name: codex-home
      mountPath: /home/multica/agents/.codex/config.toml
      subPath: config.toml
      readOnly: true
    - name: codex-home
      mountPath: /home/multica/agents/.codex/auth.json
      subPath: auth.json
      readOnly: true
