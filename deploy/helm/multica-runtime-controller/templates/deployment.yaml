apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "multica-runtime-controller.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: tmp-permissions
          image: {{ .Values.controller.image.reference | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["chmod 1777 /tmp"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: provider-home-init
          image: {{ .Values.controller.image.reference | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              install -d -m 0700 \
                /var/run/multica/agent-home/home \
                /var/run/multica/agent-home/home/.codex \
                /var/run/multica/agent-home/home/.multica
              mkdir -p \
                /workspace/.pi/agent \
                /workspace/.multica/pi-sessions
              {{- if .Values.runtime.pi.configMapName }}
              (
                cd /var/run/multica/pi-config
                find -L . -type f ! -name auth.json ! -path './..*' -exec cp --parents '{}' /workspace/.pi/ \;
              )
              chmod -R u+rwX /workspace/.pi
              {{- end }}
              node <<'NODE'
              const fs = require("fs");
              const path = "/workspace/.pi/agent/settings.json";
              const settings = fs.existsSync(path)
                ? JSON.parse(fs.readFileSync(path, "utf8"))
                : {};
              settings.packages = [];
              fs.writeFileSync(path, `${JSON.stringify(settings, null, 2)}\n`, { mode: 0o600 });
              NODE
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: agent-home
              mountPath: /var/run/multica/agent-home
            {{- if .Values.runtime.pi.configMapName }}
            - name: pi-config
              mountPath: /var/run/multica/pi-config
              readOnly: true
            {{- end }}
        {{- range $index, $package := .Values.runtime.pi.packages }}
        - name: pi-package-{{ $index }}
          image: {{ $.Values.controller.image.reference | quote }}
          imagePullPolicy: {{ $.Values.controller.image.pullPolicy }}
          command: ["/opt/multica/providers/bin/pi"]
          args: ["install", {{ $package | quote }}]
          env:
            - name: HOME
              value: /home/multica/agents
            - name: TMPDIR
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          resources:
            {{- toYaml $.Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.controller.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: agent-home
              mountPath: /home/multica/agents
              subPath: home
            - name: workspace
              mountPath: /home/multica/agents/.pi
              subPath: .pi
        {{- end }}
      containers:
        - name: controller
          image: {{ .Values.controller.image.reference | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          tty: true
          workingDir: /home/multica/agents
          args: ["daemon"]
          {{- with .Values.runtime.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- with .Values.runtime.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: HOME
              value: /home/multica/agents
            - name: MULTICA_BASE_URL
              value: {{ .Values.multica.baseURL | quote }}
            - name: MULTICA_DAEMON_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "multica-runtime-controller.identitySecretName" . }}
                  key: daemon-id
            - name: MULTICA_CONTROLLER_TOKEN_FILE
              value: /var/run/multica/controller/token
            - name: MULTICA_RUNTIME_IMAGE
              value: {{ .Values.runtime.image.reference | quote }}
            - name: MULTICA_RUNTIME_IMAGE_PULL_POLICY
              value: {{ .Values.runtime.image.pullPolicy | quote }}
            - name: MULTICA_DAEMON_PROXY_URL
              value: {{ printf "http://%s:19515" (include "multica-runtime-controller.daemonProxyServiceName" .) | quote }}
            - name: MULTICA_RUNTIME_NAME
              value: {{ .Values.runtime.name | quote }}
            - name: MULTICA_WORKER_SERVICE_ACCOUNT
              value: {{ include "multica-runtime-controller.fullname" . }}-worker
            - name: MULTICA_WORKSPACE_PVC_NAME
              value: {{ include "multica-runtime-controller.workspaceClaimName" . | quote }}
            - name: MULTICA_WORKER_EXTRA_VOLUMES
              value: {{ .Values.runtime.extraVolumes | toJson | quote }}
            - name: MULTICA_WORKER_EXTRA_VOLUME_MOUNTS
              value: {{ .Values.runtime.extraVolumeMounts | toJson | quote }}
            - name: MULTICA_RUNTIME_CAPACITY
              value: {{ .Values.runtime.capacity | quote }}
            - name: MULTICA_POLL_INTERVAL
              value: {{ .Values.runtime.pollInterval | quote }}
            - name: MULTICA_HEARTBEAT_INTERVAL
              value: {{ .Values.runtime.heartbeatInterval | quote }}
            - name: MULTICA_TASK_DEADLINE
              value: {{ .Values.runtime.taskDeadline | quote }}
            - name: MULTICA_WORKER_CPU_REQUEST
              value: {{ .Values.runtime.workerResources.requests.cpu | quote }}
            - name: MULTICA_WORKER_CPU_LIMIT
              value: {{ .Values.runtime.workerResources.limits.cpu | quote }}
            - name: MULTICA_WORKER_MEMORY_REQUEST
              value: {{ .Values.runtime.workerResources.requests.memory | quote }}
            - name: MULTICA_WORKER_MEMORY_LIMIT
              value: {{ .Values.runtime.workerResources.limits.memory | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            exec:
              command: ["/usr/local/bin/multica", "daemon", "status", "--output", "json"]
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/multica", "daemon", "status", "--output", "json"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: controller-token
              mountPath: /var/run/multica/controller
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: agent-home
              mountPath: /home/multica/agents
              subPath: home
            - name: workspace
              mountPath: /home/multica/agents/.pi
              subPath: .pi
            - name: workspace
              mountPath: /home/multica/agents/.multica/pi-sessions
              subPath: .multica/pi-sessions
            {{- with .Values.runtime.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: daemon-proxy
          image: {{ .Values.controller.image.reference | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args: ["daemon-proxy"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: daemon-proxy
              containerPort: 19515
              protocol: TCP
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: controller-token
          secret:
            secretName: {{ .Values.multica.controllerTokenSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.multica.controllerTokenSecret.key }}
                path: token
        - name: tmp
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "multica-runtime-controller.workspaceClaimName" . }}
        - name: agent-home
          emptyDir: {}
        {{- if .Values.runtime.pi.configMapName }}
        - name: pi-config
          configMap:
            name: {{ .Values.runtime.pi.configMapName | quote }}
            defaultMode: 0440
            {{- with .Values.runtime.pi.configMapItems }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- with .Values.runtime.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
