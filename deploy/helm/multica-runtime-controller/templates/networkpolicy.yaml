{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: multica-runtime-controller
      ports:
        - protocol: TCP
          port: 19515
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "multica-runtime-controller.fullname" . }}-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: multica-runtime-controller
  policyTypes: ["Ingress"]
  ingress: []
{{- end }}
