apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica-runtime-controller.daemonProxyServiceName" . }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon-proxy
spec:
  selector:
    app.kubernetes.io/name: {{ include "multica-runtime-controller.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
  ports:
    - name: daemon-proxy
      port: 19515
      targetPort: daemon-proxy
      protocol: TCP
