{{- $name := include "multica-runtime-controller.identitySecretName" . -}}
{{- $daemonID := uuidv4 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (hasKey $existing.data "daemon-id") -}}
{{- $daemonID = index $existing.data "daemon-id" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "multica-runtime-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  daemon-id: {{ $daemonID | quote }}
